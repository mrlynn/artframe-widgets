name: Publish the gallery

# On every push to main: check every widget, build dist/ and deploy it to GitHub Pages
# (https://mrlynn.github.io/artframe-widgets/). artframe.mlynn.dev/widgets/* is served
# from there by the site's rewrites, so a merged widget is live within minutes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the index
        run: tools/build_index.py
      - name: Add the spec, for the site's /widgets/spec page
        run: cp spec/SPEC.md dist/SPEC.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
