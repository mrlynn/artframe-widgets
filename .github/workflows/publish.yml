name: Publish the gallery

# On every push to main: check every widget, build dist/ (screenshots stripped of metadata) and deploy it to GitHub Pages
# (https://mrlynn.github.io/artframe-widgets/). artframe.mlynn.dev/widgets/* is served
# from there by the site's rewrites, so a merged widget is live within minutes.

on:
  push:
    branches: [main]
  # Monthly, so the signed index (valid 30 days) is re-issued even when nothing is merged.
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test the index tools
        run: python3 -m unittest discover -s tools
      # Signs dist/index.json (index.json.sig). The secret is the base64 Ed25519 key; this job
      # runs only for main, never for pull requests, and fails rather than publish unsigned.
      - name: Build and sign the index
        env:
          ARTFRAME_INDEX_SIGNING_KEY: ${{ secrets.ARTFRAME_INDEX_SIGNING_KEY }}
        run: tools/build_index.py --require-signature
      - name: Add the spec, for the site's /widgets/spec page
        run: cp spec/SPEC.md dist/SPEC.md
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
