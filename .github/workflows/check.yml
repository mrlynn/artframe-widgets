name: Check widgets

# The pull request's own copy of the tools, for quick feedback (and to test changes to tools/
# or checker/). It runs untrusted code with a read-only token and no secrets, and a pull request
# can edit this file, so it's advisory: the check that guards merging is "Pull request rules"
# (policy.yml), which runs the base branch's tools.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # so --base can compare with what's published
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the checker
        working-directory: checker
        run: ./gradlew -q installDist
      - name: Test the index tools
        run: python3 -m unittest discover -s tools
      - name: Check
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            tools/build_index.py --check --base "origin/$BASE_REF"
          else
            tools/build_index.py
          fi
      - name: Keep the built index
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: widgets-index
          path: dist/
